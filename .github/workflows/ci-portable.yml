name: CI (portable, no MKL)

on:
  push:
    branches: [main]
  pull_request:

# Limit concurrent runs: a newer commit on the same ref cancels the in-progress
# run instead of piling workflows up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.cxx }} / ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # No install step: the ubuntu-latest image already ships CMake, Ninja,
      # GCC, and Clang, and -DCQR_WITH_MKL=OFF needs nothing more than a C++17
      # compiler. Skipping both the toolchain and the heavy libmkl-dev install
      # is what keeps this the quick, BLAS-free smoke check.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCQR_WITH_MKL=OFF

      - name: Build
        run: cmake --build build -j

      - name: Test (portable suites)
        run: ctest --test-dir build --output-on-failure
