name: Style

# The hooks of .pre-commit-config.yaml over the whole tree: clang-format
# for the C++ and the generic checks (whitespace, line endings, file
# sizes). Kept apart from the build so that a stray blank line fails fast
# and on its own; the job needs nothing but Python and takes seconds.
#
# clang-tidy lives in clang-tidy.yml and runs on manual dispatch only: it
# needs a configured build tree, which means installing MKL and an LLVM
# toolchain on the runner every time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pre-commit

      - name: Check
        run: pre-commit run --all-files --show-diff-on-failure
